name: Reproducibility CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run offline end-to-end reproduction
        run: python src/run_pipeline.py --output-dir ci-output

      - name: Retain generated tables and figures
        uses: actions/upload-artifact@v4
        with:
          name: frozen-reproduction-${{ github.sha }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
